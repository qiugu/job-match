<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>左侧固定菜单与对话历史 — JDMatch 2.0 交互设计</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5efe4;
    color: #171310;
    line-height: 1.6;
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .meta {
    font-size: 12px; color: #75695c; margin-bottom: 16px;
    letter-spacing: 0.02em;
  }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 4px; border: 1.5px solid #171310;
    margin-right: 6px;
  }
  .badge.final { background: #b9f2ce; }
  .badge.archive { background: #ffd7d3; color: #7a271a; }
  .desc {
    font-size: 13px; color: #3d352c; background: #fffdf8;
    border: 1.5px solid #171310; border-radius: 6px;
    padding: 12px 14px; margin: 16px 0 20px;
  }
  .stage {
    background: #fffdf8; border: 2px solid #171310; border-radius: 8px;
    box-shadow: 4px 4px 0 #171310; padding: 12px; overflow: hidden;
  }
  .stage svg { width: 100%; height: auto; display: block; }
  .note {
    font-size: 12px; color: #75695c; margin-top: 20px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="stage">

  </div>
  <div class="note">本设计稿采用项目 Paper &amp; Punch 设计语言（奶油纸 #fbf6ea / 硬墨 #171310 / 钴蓝 #2b3aff / 撞色黄油 #ffe27a）。</div>
</div>

</html>
