[project]
name = "jobmatch"
version = "0.1.0"
description = "简历匹配 Agent 后端服务（FastAPI）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "langchain>=0.2",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "langgraph>=0.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "alembic>=1.13",
    "langchain-deepseek>=1.1.0",
    "pyjwt>=2.13.0",
]

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python3"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 代码位于 app/ 目录，但项目名为 jobmatch；显式声明包目录，
# 否则 hatchling 默认按“包名=目录名”查找 jobmatch/ 失败。
[tool.hatch.build.targets.wheel]
packages = ["app"]
