[project]
name = "jobmatch"
version = "0.1.0"
description = "简历匹配 Agent 后端服务（FastAPI）"
readme = "README.md"
requires-python = ">=3.12"
# 与根目录 LICENSE（PolyForm Noncommercial License 1.0.0）保持一致
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "pymupdf>=1.28",
    "pymupdf4llm>=1.28",
    "langchain>=0.2",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "langgraph>=0.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "alembic>=1.13",
    "langchain-deepseek>=1.1.0",
    "pyjwt>=2.13.0",
    # 服务端 PDF 矢量导出（headless Chromium 渲染打印版 HTML）；chromium 二进制
    # 由 Dockerfile 内 `playwright install chromium --with-deps` 提供
    "playwright>=1.45",
]

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python3"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "reportlab>=5.0.1",
]

# 代码位于 app/ 目录，但项目名为 jobmatch；显式声明包目录，
# 否则 hatchling 默认按“包名=目录名”查找 jobmatch/ 失败。
[tool.hatch.build.targets.wheel]
packages = ["app"]
