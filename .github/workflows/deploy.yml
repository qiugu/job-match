# deploy.yml — 使用 GitHub Actions 替代本地 deploy.sh 把代码部署到服务器
#
# 触发方式：
#   - 推送到 main 分支时自动部署（默认）。
#   - 也可在 Actions 页面手动触发（workflow_dispatch），手动时可覆盖以下参数：
#       no_upload : true 时跳过上传（仅迁移 + 部署）
#       no_build  : true 时不重建镜像（docker compose up -d，不做 --build）
#
# 必需的 GitHub Secrets / Variables（在仓库 Settings → Secrets and variables → Actions 配置）：
#   REMOTE_DEPLOY_TARGET : user@host:/absolute/path  部署目标（host:/abs/path 形式）
#   SSH_PRIVATE_KEY       : 服务器登录私钥（PEM 内容，注意 *.pem 已被 .gitignore 忽略，需手动在 Secrets 配置）
#   KNOWN_HOSTS           : （可选）ssh-keyscan 输出，留空则自动 accept-new
#   DEPLOY_REQUIRED_VARS  : （可选）覆盖 .env 必填项检查，逗号分隔，默认 LLM_API_KEY,AUTH_SECRET_KEY,AUTH_BOOTSTRAP_PASSWORD
#   镜像部署：构建 Runner 将镜像导出为 Actions Artifact，再通过 SSH 上传到服务器；部署过程不访问 GHCR/TCR。
#   如需另行发布镜像到 Registry，可在独立 workflow 中配置注册表凭据，不参与本部署链路。
#   TLS_CERT              : （推荐）TLS 证书全文（fullchain PEM，即本地 jdmatch.site_bundle.crt 的完整内容，
#                           含 leaf + 中间证书的所有 BEGIN/END CERTIFICATE 块）
#   TLS_KEY               : （推荐）TLS 私钥全文（PEM，即本地 jdmatch.site.key 的完整内容）
#
#   TLS_CERT / TLS_KEY 说明（路径 B）：
#     证书与私钥被 .gitignore 忽略（jdmatch.site* / *.pem），actions/checkout 取不到，
#     rsync 上传也不会包含 —— 服务器上的证书此前只能人工放置，一旦损坏或缺失
#     （如被误传为 CSR、或挂载失败时被 Docker 自动建成目录），Actions 无法自愈。
#     两者同时配置时，部署会在启动前把证书写入服务器并做 openssl 解析 + 配对校验
#     （fail-fast，不带病启动）；任一缺失则跳过注入，沿用服务器上已有证书。
#
# 设计说明（与 deploy.sh 对齐）：
#   - .env 不随代码上传：服务器侧的 .env 才是生产配置唯一真相（避免本地 .env 覆盖线上已轮换密钥）。
#     仅当服务器尚未存在 .env 且 Secrets 中提供了 DEPLOY_ENV_FILE 时，才首次播种 .env（权限 600）。
#   - 迁移前自动在线备份 SQLite（保留最近 10 份），迁移失败不影响数据。
#   - 迁移期间先停 backend 容器，避免 database is locked / schema 漂移。
#   - 启动使用 --wait 等待 healthcheck；最终探 /health 做健康验证。

name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_upload:
        description: "跳过上传（仅迁移 + 部署）"
        type: boolean
        default: false
      no_build:
        description: "不重建镜像（docker compose up -d 不做 --build）"
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Independent runners avoid serial backend/frontend builds and memory contention.
  build:
    name: Build (${{ matrix.image }})
    if: ${{ github.event.inputs.no_build != 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: Dockerfile
            # GitHub-hosted runners use the official CDN, not a China mirror.
            build_args: PLAYWRIGHT_DOWNLOAD_HOST=
          - image: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
            build_args: |
              VITE_JOBMATCH_API=
              VITE_SITE_URL=https://jdmatch.site
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: setup-buildx

      - name: Cache backend BuildKit mounts
        if: ${{ matrix.image == 'backend' }}
        uses: actions/cache@v4
        id: backend-build-cache
        with:
          path: .buildkit-cache
          key: job-matcher-backend-buildkit-${{ runner.os }}-${{ hashFiles('Dockerfile', 'pyproject.toml', 'uv.lock') }}
          restore-keys: |
            job-matcher-backend-buildkit-${{ runner.os }}-

      - name: Restore backend BuildKit cache mounts
        if: ${{ matrix.image == 'backend' }}
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: .buildkit-cache
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.backend-build-cache.outputs.cache-hit }}

      - name: Prepare image tag
        id: image
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          echo "tag=job-matcher-${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # The action supplies the GHA cache runtime URL/token and GitHub API token.
      # Cache export is best effort; it must not hold a published image indefinitely.
      - name: Build image for SSH deployment
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=job-matcher-${{ matrix.image }},timeout=5m
          cache-to: type=gha,scope=job-matcher-${{ matrix.image }},mode=max,timeout=5m,ignore-error=true

      - name: Export image archive
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/jobmatch-${IMAGE_NAME}-${GITHUB_SHA}.tar.gz"
          docker image inspect "$IMAGE_TAG" >/dev/null
          image_size_bytes="$(docker image inspect --format '{{.Size}}' "$IMAGE_TAG")"
          echo "METRIC image=${IMAGE_NAME} uncompressed_bytes=${image_size_bytes}"
          docker save "$IMAGE_TAG" | gzip -1 > "$archive"
          archive_bytes="$(stat -c%s "$archive")"
          echo "METRIC image=${IMAGE_NAME} compressed_bytes=${archive_bytes}"
          du -h "$archive"
          sha256sum "$archive"

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: jobmatch-image-${{ matrix.image }}
          path: ${{ runner.temp }}/jobmatch-${{ matrix.image }}-${{ github.sha }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    # no_build intentionally skips build; failed/cancelled builds must never deploy.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    # 代码上传最多 25 分钟、镜像归档传输与加载最多 140 分钟，留出 compose/健康检查余量。
    timeout-minutes: 180
    runs-on: ubuntu-latest
    # 避免因密钥缺失导致静默成功
    environment: production
    env:
      REMOTE_DEPLOY_TARGET: ${{ secrets.REMOTE_DEPLOY_TARGET }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_REQUIRED_VARS: ${{ secrets.DEPLOY_REQUIRED_VARS || 'LLM_API_KEY,AUTH_SECRET_KEY,AUTH_BOOTSTRAP_PASSWORD' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Sanity check inputs
        run: |
          set -euo pipefail
          if [[ -z "${REMOTE_DEPLOY_TARGET:-}" ]]; then
            echo "::error::缺少 Secret REMOTE_DEPLOY_TARGET（格式 user@host:/absolute/path）" >&2
            exit 1
          fi
          if [[ "${REMOTE_DEPLOY_TARGET}" != *:* || "${REMOTE_DEPLOY_TARGET}" != */?* ]]; then
            echo "::error::REMOTE_DEPLOY_TARGET 格式应为 user@host:/absolute/path（路径需为绝对路径）" >&2
            exit 1
          fi
          if [[ -z "${SSH_PRIVATE_KEY:-}" ]]; then
            echo "::error::缺少 Secret SSH_PRIVATE_KEY" >&2
            exit 1
          fi
          echo "target=${REMOTE_DEPLOY_TARGET}"

      - name: Install ssh / rsync
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends openssh-client rsync
          # docker / docker compose 仅用于本地前置校验一致性提示；实际部署在远端执行

      - name: Download image archives
        if: ${{ github.event.inputs.no_build != 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: jobmatch-image-*
          path: .deploy-images
          merge-multiple: true

      - name: Validate image archives
        if: ${{ github.event.inputs.no_build != 'true' }}
        run: |
          set -euo pipefail
          for image in backend frontend; do
            archive=".deploy-images/jobmatch-${image}-${GITHUB_SHA}.tar.gz"
            [[ -s "$archive" ]] || { echo "::error::缺少镜像归档 $archive" >&2; exit 1; }
            echo "$(du -h "$archive" | cut -f1) $archive"
          done

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # 写入私钥并收敛权限（ssh 要求私钥 600）
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 已知主机：提供 KNOWN_HOSTS 则用，否则 accept-new（首次连接自动信任）
          if [[ -n "${KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
          else
            touch ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            ssh-keyscan -H "${REMOTE_DEPLOY_TARGET%%:*}" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
        env:
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}

      # ---------- 第 3 步：上传代码（对应 deploy.sh [3/5]） ----------
      - name: Upload code via rsync
        if: ${{ github.event.inputs.no_upload != 'true' }}
        run: |
          set -euo pipefail
          REMOTE="${REMOTE_DEPLOY_TARGET}"
          REMOTE_HOST="${REMOTE%%:*}"
          REMOTE_PATH="${REMOTE#*:}"
          SSH_OPTS=(-o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -T -i ~/.ssh/id_deploy)
          RSYNC_SSH="ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=4 -i ~/.ssh/id_deploy -o PreferredAuthentications=publickey -o PasswordAuthentication=no"

          echo "==> 上传代码到 ${REMOTE}"
          # 确保远端目标目录存在（兼容需 root 的场景，用 sudo 创建并改属主）
          RP=$(printf '%q' "$REMOTE_PATH")
          ssh "${SSH_OPTS[@]}" "$REMOTE_HOST" "sudo mkdir -p ${RP} && sudo chown \$(id -u):\$(id -g) ${RP}"

          # 排除：git、依赖、构建产物、隔离工作树、数据库、本地 .env（服务器 .env 为唯一真相）。
          # .worktrees 可能包含多个完整 node_modules/venv，不能随代码上传。
          RSYNC_ARGS=(
            -az
            --partial
            --append-verify
            --timeout=60
            --info=progress2,stats2
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude 'node_modules/' \
            --exclude 'frontend/node_modules/' \
            --exclude 'frontend/dist/' \
            --exclude '.worktrees/' \
            --exclude '.workbuddy/' \
            --exclude '.superpowers/' \
            --exclude '.codex/' \
            --exclude '.agents/' \
            --exclude '.deploy-images/' \
            --exclude '.logs/' \
            --exclude '.pids/' \
            --exclude '.pytest_cache/' \
            --exclude '.history/' \
            --exclude '.agent/' \
            --exclude '.tanstack/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '*.db' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.DS_Store'
          )
          echo "==> 统计代码上传规模"
          rsync --dry-run --stats --human-readable -e "$RSYNC_SSH" "${RSYNC_ARGS[@]}" ./ "$REMOTE/" | tail -n 12

          echo "==> 上传代码到 ${REMOTE}（单次最长 25 分钟，断点可续传）"
          set +e
          timeout --signal=TERM --kill-after=30s 25m \
            rsync -e "$RSYNC_SSH" "${RSYNC_ARGS[@]}" ./ "$REMOTE/"
          rsync_status=$?
          set -e
          if (( rsync_status != 0 )); then
            echo "::error::rsync 上传失败或超时（exit=${rsync_status}）；检查远端磁盘和网络后可重试断点上传" >&2
            ssh "${SSH_OPTS[@]}" "$REMOTE_HOST" "df -h ${RP} /tmp" || true
            exit "$rsync_status"
          fi

          # 首次播种 .env：仅当服务器不存在 .env 且 Secrets 中提供了 DEPLOY_ENV_FILE
          if [[ -n "${DEPLOY_ENV_FILE:-}" ]]; then
            if ! ssh "${SSH_OPTS[@]}" "$REMOTE_HOST" "test -f ${RP}/.env"; then
              echo "==> 首次部署：播种 .env 到服务器（仅此一次）"
              printf '%s\n' "${DEPLOY_ENV_FILE}" > /tmp/deploy.env
              rsync -az -e "$RSYNC_SSH" /tmp/deploy.env "$REMOTE/.env"
              ssh "${SSH_OPTS[@]}" "$REMOTE_HOST" "chmod 600 ${RP}/.env"
            fi
          fi
          echo "    上传完成"
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}

      - name: Transfer images over SSH
        if: ${{ github.event.inputs.no_build != 'true' }}
        timeout-minutes: 140
        run: |
          set -euo pipefail
          .github/scripts/transfer-images.sh \
            ".deploy-images/jobmatch-backend-${GITHUB_SHA}.tar.gz" \
            ".deploy-images/jobmatch-frontend-${GITHUB_SHA}.tar.gz" \
            "job-matcher-backend:${GITHUB_SHA}" \
            "job-matcher-frontend:${GITHUB_SHA}"

      # ---------- 第 4 步：服务器端 .env 与数据库迁移（对应 deploy.sh [4/5]） ----------
      - name: Server env check & database migration
        run: |
          set -euo pipefail
          REMOTE="${REMOTE_DEPLOY_TARGET}"
          REMOTE_HOST="${REMOTE%%:*}"
          REMOTE_PATH="${REMOTE#*:}"
          SSH_OPTS=(-o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -T -i ~/.ssh/id_deploy)
          RP=$(printf '%q' "$REMOTE_PATH")
          REQ_VARS="${DEPLOY_REQUIRED_VARS}"

          ssh "${SSH_OPTS[@]}" "$REMOTE_HOST" bash -s "$REMOTE_PATH" "$REQ_VARS" <<'EOF'
          set -euo pipefail
          REMOTE_PATH="$1"; shift
          REQ_VARS="$1"; shift
          IFS=',' read -ra REQUIRED_VARS <<< "$REQ_VARS"

          echo "  [4.0] 备份数据库（迁移前，防止迁移/重建损坏数据）"
          BACKUP_DIR="$REMOTE_PATH/backups"
          mkdir -p "$BACKUP_DIR"
          TS="$(date +%Y%m%d_%H%M%S)"
          BAK="$BACKUP_DIR/jobmatch-$TS.db"
          if docker compose --project-directory "$REMOTE_PATH" ps -q backend 2>/dev/null | grep -q .; then
            if docker compose --project-directory "$REMOTE_PATH" exec -T backend \
                 python -c "import os,sqlite3; p='/app/data/jobmatch.db'; assert os.path.getsize(p)>0, 'db empty'; s=sqlite3.connect(p); d=sqlite3.connect('/tmp/jobmatch_bak.db'); s.backup(d); d.close(); s.close()" && \
               docker compose --project-directory "$REMOTE_PATH" cp backend:/tmp/jobmatch_bak.db "$BAK"; then
              echo "    已备份: $BAK"
            else
              echo "    ⚠ 在线备份失败（或数据库为空，首次部署属正常），请手动确认数据库状态后再继续" >&2
            fi
          else
            if docker compose --project-directory "$REMOTE_PATH" run --rm -v "$BACKUP_DIR:/backup" backend \
                 python -c "import os,sqlite3; p='/app/data/jobmatch.db'; assert os.path.getsize(p)>0, 'db empty'; s=sqlite3.connect(p); d=sqlite3.connect('/backup/jobmatch-$TS.db'); s.backup(d); d.close(); s.close()" 2>/dev/null; then
              echo "    已备份: $BAK"
            else
              echo "    ℹ 未能备份（卷中尚无数据库，首次部署属正常）"
            fi
          fi
          ls -1t "$BACKUP_DIR"/jobmatch-*.db 2>/dev/null | tail -n +11 | xargs -r rm -f

          echo "  [4.1] 检查服务器目录与 .env"
          mkdir -p "$REMOTE_PATH"
          cd "$REMOTE_PATH"
          if [[ -f .env ]]; then
            echo "    服务器已存在 .env，保留不覆盖"
          else
            if [[ -f .env.example ]]; then
              cp .env.example .env
              chmod 600 .env
              echo "    ⚠ 服务器无 .env，已用 .env.example 创建（权限 600），请补全必填项后再继续"
            else
              echo "    ✗ 服务器上既无 .env 也无 .env.example，无法继续" >&2
              exit 1
            fi
          fi
          if [[ -f .env && "$(stat -c '%a' .env 2>/dev/null)" != "600" ]]; then
            chmod 600 .env
          fi

          echo "  [4.2] 校验 .env 必填项"
          missing=0
          for v in "${REQUIRED_VARS[@]}"; do
            val="$(grep -E "^${v}=" .env | tail -n1 | sed -E 's/^[^=]*=//; s/^["'\''"]|["'\''"]$//g')"
            if [[ -z "$val" ]]; then
              echo "    ✗ .env 必填项 $v 缺失或为空" >&2
              missing=1
            fi
          done
          if [[ $missing -eq 1 ]]; then
            echo "    请先在服务器 $REMOTE_PATH/.env 中填写上述必填项，再重新运行部署。" >&2
            exit 1
          fi
          echo "    服务器 .env 必填项均已填写"

          echo "  [4.3] 停止 backend 写入，再执行迁移"
          docker compose --project-directory "$REMOTE_PATH" stop backend 2>/dev/null || true
          docker compose --project-directory "$REMOTE_PATH" run --rm backend python -m alembic upgrade head
          echo "    迁移完成"
          EOF

      # ---------- 第 4.5 步：注入 TLS 证书（路径 B：证书经 Secrets 管理，而非 git） ----------
      #
      # 背景：jdmatch.site* / *.pem 被 .gitignore 忽略，actions/checkout 取不到证书，
      #       rsync 上传也不包含它们 —— 服务器上的证书此前只能人工放置，一旦损坏/缺失
      #       （如被误传为 CSR、或挂载失败时被 Docker 自动建成目录），Actions 无法自愈。
      # 本步骤：Secrets 读取 → base64 传输（避免多行 PEM 被 shell/ssh 引号破坏）→
      #         服务器落盘 → openssl 解析 + 私钥配对校验（fail-fast，不带病启动）。
      - name: Write TLS certificates from Secrets
        run: |
          set -euo pipefail
          REMOTE="${REMOTE_DEPLOY_TARGET}"
          REMOTE_HOST="${REMOTE%%:*}"
          REMOTE_PATH="${REMOTE#*:}"
          SSH_OPTS=(-o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -T -i ~/.ssh/id_deploy)
          RP=$(printf '%q' "$REMOTE_PATH")

          if [[ -z "${TLS_CERT:-}" || -z "${TLS_KEY:-}" ]]; then
            echo "::warning::未配置 Secrets TLS_CERT / TLS_KEY，跳过证书注入（沿用服务器上已有证书）。强烈建议配置，否则服务器证书损坏时 Actions 无法自愈（见 deploy.yml 头部说明）。"
            exit 0
          fi

          # base64 单行传输：PEM 多行内容经 ssh 管道最安全，绕开引号/换行破坏
          printf '%s' "${TLS_CERT}" | base64 -w0 | ssh "${SSH_OPTS[@]}" "$REMOTE_HOST" "cat > ${RP}/.tls_cert.b64"
          printf '%s' "${TLS_KEY}"  | base64 -w0 | ssh "${SSH_OPTS[@]}" "$REMOTE_HOST" "cat > ${RP}/.tls_key.b64"

          # 服务器侧落盘 + 校验；传 REMOTE_PATH 作位置参数，避免路径拼接进脚本体
          ssh "${SSH_OPTS[@]}" "$REMOTE_HOST" bash -s "$REMOTE_PATH" <<'EOF'
          set -euo pipefail
          RP="$1"
          cd "$RP"
          # 若证书路径曾被 Docker 在挂载失败时自动建成目录（典型报错
          # 「mount a directory onto a file」），必须先删除目录才能写文件
          [[ -d jdmatch.site_bundle.crt ]] && rm -rf jdmatch.site_bundle.crt
          [[ -d jdmatch.site.key ]] && rm -rf jdmatch.site.key
          base64 -d .tls_cert.b64 > jdmatch.site_bundle.crt
          base64 -d .tls_key.b64  > jdmatch.site.key
          rm -f .tls_cert.b64 .tls_key.b64
          chmod 644 jdmatch.site_bundle.crt
          chmod 600 jdmatch.site.key
          # fail-fast：证书可解析、私钥可解析、且两者配对（公钥指纹一致）。
          # 用 pubkey 比对而非 modulus：openssl pkey -modulus 在 OpenSSL 1.1 不存在，
          # 且 modulus 方案不适用于非 RSA 密钥；pubout 全版本可用。
          openssl x509 -in jdmatch.site_bundle.crt -noout >/dev/null
          openssl pkey -in jdmatch.site.key -noout >/dev/null
          C="$(openssl x509 -in jdmatch.site_bundle.crt -noout -pubkey | openssl md5)"
          # 注意：pkey 的 -noout 会连 -pubout 输出一起抑制（x509 无此问题），故这里不能加 -noout
          K="$(openssl pkey -in jdmatch.site.key -pubout | openssl md5)"
          if [[ "$C" != "$K" ]]; then
            echo "✗ TLS_CERT 与 TLS_KEY 不配对（公钥指纹不一致），请检查两个 Secrets 的内容是否属于同一证书对" >&2
            exit 1
          fi
          echo "    TLS 证书已写入并通过 openssl 配对校验（subject: $(openssl x509 -in jdmatch.site_bundle.crt -noout -subject | sed 's/^subject=//')）"
          EOF
        env:
          TLS_CERT: ${{ secrets.TLS_CERT }}
          TLS_KEY: ${{ secrets.TLS_KEY }}

      # ---------- 第 5 步：docker compose 启动（对应 deploy.sh [5/5]） ----------
      #
      # Images have already been built on GitHub-hosted runners and loaded on
      # the server over SSH. Keep existing services running until Compose replaces them.
      - name: Start services (docker compose up -d)
        run: |
          set -euo pipefail
          REMOTE="${REMOTE_DEPLOY_TARGET}"
          REMOTE_HOST="${REMOTE%%:*}"
          REMOTE_PATH="${REMOTE#*:}"
          SSH_OPTS=(-o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -T -i ~/.ssh/id_deploy)
          RP=$(printf '%q' "$REMOTE_PATH")

          NO_BUILD="${{ github.event.inputs.no_build }}"

          if [[ "$NO_BUILD" == "true" ]]; then
            ssh "${SSH_OPTS[@]}" "$REMOTE_HOST" \
              docker compose --project-directory "$RP" up -d --wait --wait-timeout 120 2>/dev/null \
              || ssh "${SSH_OPTS[@]}" "$REMOTE_HOST" \
              docker compose --project-directory "$RP" up -d
          else
            ssh "${SSH_OPTS[@]}" "$REMOTE_HOST" \
              docker compose --project-directory "$RP" up -d --wait --wait-timeout 120 2>/dev/null \
              || ssh "${SSH_OPTS[@]}" "$REMOTE_HOST" \
              docker compose --project-directory "$RP" up -d
          fi

      # ---------- 部署后健康验证 ----------
      - name: Health check
        run: |
          set -uo pipefail
          REMOTE="${REMOTE_DEPLOY_TARGET}"
          REMOTE_HOST="${REMOTE%%:*}"
          REMOTE_PATH="${REMOTE#*:}"
          SSH_OPTS=(-o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -T -i ~/.ssh/id_deploy)
          # 直连 backend 容器内部探活（复用 compose 内部 healthcheck 同源探针），
          # 绕过 nginx 反代与宿主机 curl 依赖；带退避重试避免瞬时抖动误报。
          ok=0
          for i in $(seq 1 10); do
            if ssh "${SSH_OPTS[@]}" "$REMOTE_HOST" "docker compose --project-directory ${REMOTE_PATH} exec -T backend python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8005/health').status==200 else 1)\"" >/dev/null 2>&1; then
              echo "::notice::后端健康检查通过（容器内直连 backend:8005/health，第 ${i} 次）"
              ok=1
              break
            fi
            echo "  第 ${i} 次探活未通过，3s 后重试..."
            sleep 3
          done

          # 后端探活通过即视为部署成功；额外探测 nginx 反代路径（用户可达性），
          # 失败仅告警不阻断，避免掩盖真实问题（如 nginx 容器未起 / 80 端口冲突）。
          if ssh "${SSH_OPTS[@]}" "$REMOTE_HOST" "curl -fsS http://localhost/health" >/dev/null 2>&1; then
            echo "::notice::nginx 反代 /health 探针通过"
          else
            echo "::warning::nginx 反代路径 http://localhost/health 不可达：后端本身健康，但用户可能无法经 nginx 访问，请检查 nginx 容器状态与 80/443 端口占用"
          fi

          if [[ $ok -eq 1 ]]; then
            exit 0
          fi

          # 后端直连探活失败：打印后端与 nginx 日志定位真因。
          echo "::error::后端健康检查未通过，打印后端与 nginx 日志以便排查："
          ssh "${SSH_OPTS[@]}" "$REMOTE_HOST" \
            "docker compose --project-directory ${REMOTE_PATH} logs --tail=60 backend nginx" || true
          exit 1
