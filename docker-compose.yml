services:
  # 反向代理：唯一对外入口（宿主仅暴露 80/443），统一代理前端与后端 API
  nginx:
    image: nginx:1.27-alpine
    # 默认使用 HTTP 配置；启用 HTTPS 时把 nginx.ssl.conf 挂为 default.conf 并将证书放入 nginx/certs
    volumes:
      # HTTP 配置（停用）
      # - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS 配置（启用）：证书来自仓库根目录，挂载进容器只读
      - ./nginx/nginx.ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./jdmatch.site_bundle.crt:/etc/nginx/certs/jdmatch.site_bundle.crt:ro
      - ./jdmatch.site.key:/etc/nginx/certs/jdmatch.site.key:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    # 健康检查：经 nginx 自身探 /health（反代至 backend）。
    # nginx 崩溃循环（如证书损坏导致 cannot load certificate）时 up --wait 直接失败，
    # 不再「容器反复重启、对外永不监听」的静默故障。
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 后端：Python FastAPI 简历匹配服务
  # 注意：不再直接映射宿主端口，仅经 nginx 在容器网络内可达，提升安全性
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # GitHub Actions loads the built image on the server over SSH, then tags it
    # here so Compose can start the published build without compiling on the VM.
    image: job-matcher-backend:deploy
    # 统一使用 8005：Dockerfile EXPOSE、run 启动端口、nginx 转发三者一致
    expose:
      - "8005"
    env_file:
      - .env
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8005
      # 跨域来源：容器网络内的前端 + 对外访问域名（由 .env 的 CORS_ORIGINS 注入）
      # 经 nginx 同源代理后，浏览器看到的 Origin 即对外域名，无需暴露 backend 端口
      - DATABASE_URL=sqlite+aiosqlite:////app/data/jobmatch.db
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8005/health').status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      # 2G 小内存机冷启动（langchain 导入 + 双重 alembic + bootstrap_auth）常超 15s，
      # 放宽到 90s 避免健康探测在后端尚未就绪时误判失败。
      start_period: 90s

  # 前端：TanStack Start 生产服务器（SSR + 静态资源）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 构建期注入：import.meta.env.VITE_JOBMATCH_API 是编译期常量，
        # 运行时通过 environment 设置无效，必须在 build 阶段传入。
        # 经 nginx 同源代理，前端直接以相对路径调用 /api，无需直连 backend 端口，
        # 也彻底消除跨域，CORS 仅作同源兜底。
        VITE_JOBMATCH_API: ""
        # 站点基址：canonical / hreflang / OG / sitemap 全部由此派生，必须与对外
        # 域名与协议一致（生产为 https://jdmatch.site）。
        VITE_SITE_URL: "https://jdmatch.site"
    image: job-matcher-frontend:deploy
    expose:
      - "3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
