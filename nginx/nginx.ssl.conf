# 生产 HTTPS 配置（已启用）
# 证书位于仓库根目录，由 docker-compose 挂载到 /etc/nginx/certs/：
#   jdmatch.site_bundle.crt  -> 完整链（leaf + 中间证书）
#   jdmatch.site.key         -> 私钥
# 注意：用 docker-compose 切换本文件为 default.conf 并放开 443 端口即可启用。

# 容器网络内上游（开启 keepalive 复用连接，降低握手开销）
upstream frontend_upstream {
    server frontend:3005;
    keepalive 32;
}
upstream backend_upstream {
    server backend:8005;
    keepalive 32;
}

# ===== HTTP 80：除健康检查外，全部 301 跳转到 HTTPS =====
server {
    listen 80;
    server_name jdmatch.site www.jdmatch.site;

    server_tokens off;

    # 供负载均衡 / 存活探测在 80 端口直接探活（不强制跳转）
    location = /health {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location / {
        # 归一到裸域：写死域名而非 $host，否则 www 会被 301 成
        # https://www.jdmatch.site，与裸域形成两份可索引内容。
        return 301 https://jdmatch.site$request_uri;
    }
}

# ===== HTTPS 443：www 归一到裸域（证书 SAN 已覆盖 www） =====
server {
    listen 443 ssl;
    http2 on;
    server_name www.jdmatch.site;

    ssl_certificate     /etc/nginx/certs/jdmatch.site_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/jdmatch.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;

    location = /health {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://jdmatch.site$request_uri;
    }
}

# ===== HTTPS 443：主站 =====
server {
    listen 443 ssl;
    http2 on;
    server_name jdmatch.site;

    ssl_certificate     /etc/nginx/certs/jdmatch.site_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/jdmatch.site.key;

    # 协议与加密套件（ECDHE-only，现代中间兼容级别）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # 会话复用，减少 TLS 握手
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP 装订（失败为软降级，不影响建连）
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/certs/jdmatch.site_bundle.crt;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;
    client_max_body_size 20m;

    # Gzip 压缩
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

    # 前端静态资源：内容哈希不可变，长缓存
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|map|webp|avif)$ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 前端（SSR + 页面）
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI 流式接口：关闭缓冲，保证逐字实时到达浏览器
    location /api/ai/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 健康检查
    location = /health {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
