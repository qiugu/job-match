<!--
  JDMatch 主标识 · 白底墨标（浅色背景默认形态）
  构造：100×100 网格。J 与 D 共用同一条垂直主脊 —— 主脊既是 J 的笔画，也是 D 的竖杆；
  D 的碗形向右展开，J 的钩形自主脊末端向左回卷，两字咬合成一个不可分割的整体。
  规范见 docs/BRAND.md。深色背景请改用 logo-white.svg（不要依赖媒体查询自动翻转）。
-->
