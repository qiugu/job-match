  <path d="M53 16V84" stroke="#0A0A0B" stroke-width="14" stroke-linecap="round"/>
  <path d="M53 16A34 34 0 0 1 53 84" stroke="#0A0A0B" stroke-width="14" stroke-linecap="round"/>
  <path d="M53 64A20 20 0 1 1 18.86 49.86" stroke="#5E6AD2" stroke-width="14" stroke-linecap="round"/>
