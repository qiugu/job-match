# Alembic 配置
# 数据库连接串通过 app.core.config 动态读取（见 migrations/env.py），
# 不在本文件中硬编码，便于本地 / Docker / 多环境复用。
[alembic]
script_location = migrations
# 预置占位；env.py 中会依据 app.core.config 覆盖为真实 async URL
sqlalchemy.url = sqlite+aiosqlite:///./jobmatch.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
